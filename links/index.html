<!DOCTYPE html>
<!--
  MysMatch link-in-bio page (www.mysmatch.com/links) for the Instagram bio.
  WHY self-hosted instead of Linktree: the link stays on our own domain/brand, has
  no third-party footer, and is one static file we edit like the rest of the site.
  Styling copies the landing page tokens (Geist + violet→magenta gradient) so it
  feels like part of the same site. Store URLs and the contact mailbox are the same
  ones used on the landing page — keep them in sync if those ever change.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MysMatch — Links</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Download MysMatch on the App Store or Google Play, visit our website, or get in touch.">
<meta name="theme-color" content="#0F0B2E">
<!-- WHY noindex: a thin page of outbound links adds nothing for search; the
     landing page should be what ranks. Not listed in sitemap.xml for the same reason. -->
<meta name="robots" content="noindex, follow">

<!-- Open Graph: Instagram's in-app browser and DMs show this preview card -->
<meta property="og:title" content="MysMatch — Links">
<meta property="og:description" content="Get the app, visit our website, or say hi.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.mysmatch.com/links">
<meta property="og:image" content="https://www.mysmatch.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="/favicon.png">
<link rel="canonical" href="https://www.mysmatch.com/links">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0F0B2E;
    --muted:rgba(15,11,46,0.62);
    --bg:#FFFFFF;
    --card:#FFFFFF;
    --line:rgba(15,11,46,0.08);
    --grad:linear-gradient(95deg,#4A2BFF 0%,#8A3BFF 48%,#FF39C6 100%);
    --shadow-sm:0 1px 2px rgba(15,11,46,0.04), 0 4px 14px rgba(15,11,46,0.05);
    --grad-shadow:0 8px 22px rgba(74,43,255,0.25), 0 2px 6px rgba(255,57,198,0.15);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; }
  body{
    font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    /* WHY: soft brand glow behind the column, echoing the landing hero */
    background-image:
      radial-gradient(60% 40% at 15% 0%, rgba(74,43,255,0.12), transparent 70%),
      radial-gradient(55% 40% at 90% 10%, rgba(255,57,198,0.12), transparent 70%);
    background-repeat:no-repeat;
  }
  main{
    max-width:440px;
    margin:0 auto;
    padding:56px 16px 40px;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; min-height:100dvh;
  }
  .logo{
    width:88px; height:88px; border-radius:24px; display:block;
    box-shadow:var(--grad-shadow);
  }
  h1{
    margin-top:18px;
    font-size:26px; font-weight:800; letter-spacing:-0.03em;
  }
  .tagline{
    margin-top:6px; text-align:center;
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:20px; color:var(--muted);
  }
  .links{
    width:100%; margin-top:32px;
    display:flex; flex-direction:column; gap:12px;
    list-style:none;
  }
  .link{
    display:flex; align-items:center; gap:14px;
    width:100%; min-height:60px; padding:12px 18px;
    border-radius:18px;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
    color:var(--ink); text-decoration:none;
    font-weight:600; font-size:16px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .link:hover{ transform:translateY(-2px); box-shadow:var(--grad-shadow); }
  .link:active{ transform:translateY(0); }
  .link:focus-visible{ outline:3px solid #8A3BFF; outline-offset:3px; }
  .link .ic{
    flex:none; width:36px; height:36px; border-radius:11px;
    display:grid; place-items:center;
    background:var(--ink); color:#fff;
  }
  .link .txt{ display:flex; flex-direction:column; line-height:1.2; flex:1; min-width:0; }
  .link .txt small{ font-size:12px; font-weight:500; color:var(--muted); }
  .link .arrow{ flex:none; opacity:.35; }
  /* WHY: the two store buttons are the main goal of the page, so they get the
     brand gradient; website + email stay as quieter white cards. */
  .link.primary{
    background:var(--grad); color:#fff; border-color:transparent;
    /* WHY: without this the gradient tiles under the transparent border and
       leaves a thin magenta sliver on the left edge */
    background-origin:border-box;
    box-shadow:var(--grad-shadow);
  }
  .link.primary .ic{ background:rgba(255,255,255,0.18); }
  .link.primary .txt small{ color:rgba(255,255,255,0.8); }
  .link.primary .arrow{ opacity:.7; }
  footer{
    margin-top:auto; padding-top:40px;
    font-size:12px; color:var(--muted);
  }
  footer a{ color:inherit; }
  @media (prefers-reduced-motion:reduce){ .link{ transition:none; } .link:hover{ transform:none; } }
</style>
</head>
<body>
<main>
  <!-- WHY logo-512.png (30 KB) and not /logo.png (2000px, 1.1 MB): visitors arrive
       from Instagram on mobile data; 512px is still sharp at 88px on 3x screens. -->
  <img class="logo" src="/logo-512.png" alt="MysMatch logo" width="88" height="88">
  <h1>MysMatch</h1>
  <p class="tagline">Meet students who match your vibe</p>

      </a>
    </li>
    <li>
      <a class="link" href="https://www.mysmatch.com/">
        <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg></span>
        <span class="txt"><small>Website</small>www.mysmatch.com</span>

  </ul>

  <footer>© 2026 <a href="/">MysMatch</a></footer>
</main>
</body>
</html>
