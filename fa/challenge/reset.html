<!DOCTYPE html>

<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تعیین رمز عبور جدید — MysMatch</title>

<meta content="#0F1020" name="theme-color"/>
<!-- WHY (Oct 2026): email + Google links always return to the English page
     (Supabase Redirect URLs / auth-callback only know /challenge/). ?lang= or
     the language remembered by js/challenge.js sends people on to the
     /de/ or /fa/ copy; search + #hash are kept (the login token is in it). -->
<script>
(function () {
  if (document.documentElement.lang !== 'en') return;
  var m = /[?&]lang=(de|fa)(&|$)/.exec(location.search), l = m ? m[1] : null;
  if (!l && /[?&](welcome=1|token_hash=)/.test(location.search)) { try { l = localStorage.getItem('mmc-lang'); } catch (e) {} }
  if (l === 'de' || l === 'fa') location.replace('/' + l + location.pathname + location.search + location.hash);
})();
</script>
<link href="/logo-512.png" rel="icon" type="image/png"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="/css/site.css" rel="stylesheet"/>
<!-- Password reset for website accounts (Ideation Challenge, Oct 2026). The
     reset email goes through the auth-callback edge function, which sends
     resets that were requested on the website here (?token_hash&type=recovery)
     and every other reset into the app as before. -->
<style>
  .r-wrap{ max-width:560px; display:flex; flex-direction:column; gap:22px; }
  .fld{ display:flex; flex-direction:column; gap:10px; }
  .lbl{ font-size:17px; font-weight:600; }
  .inp{ width:100%; font-family:inherit; font-size:19px; color:var(--ink); background:#fff; border:1.5px solid #E2DEF0; border-radius:20px; padding:18px 20px; outline:none; }
  .inp:focus{ border-color:var(--violet); box-shadow:0 0 0 4px rgba(123,92,255,0.14); }
  .c-msg{ font-size:16px; line-height:1.5; padding:14px 18px; border-radius:16px; }
  .c-msg.err{ background:#FDECF2; color:#B4214F; } .c-msg.ok{ background:#E8F8EF; color:#1C7A4A; }
</style>
<!-- Plausible analytics (Oct 2026): cookieless page views + custom events (js/analytics.js). -->
<script async="" src="https://plausible.io/js/pa-DVdhhwvZTUkHlf5ZrwBf4.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>

<!-- i18n:head -->
<link rel="alternate" hreflang="en" href="https://www.mysmatch.com/challenge/reset">
<link rel="alternate" hreflang="de" href="https://www.mysmatch.com/de/challenge/reset">
<link rel="alternate" hreflang="fa" href="https://www.mysmatch.com/fa/challenge/reset">
<link rel="alternate" hreflang="x-default" href="https://www.mysmatch.com/challenge/reset">
<style>.lang-switch{display:inline-flex;align-items:center;gap:2px;margin-inline-end:10px;font-size:13px;font-weight:600;letter-spacing:.04em}.lang-switch a{color:rgba(255,255,255,.62);padding:6px 7px;border-radius:999px;text-decoration:none}.lang-switch a:hover{color:#fff}.lang-switch a[aria-current]{color:#fff;background:rgba(255,255,255,.12)}.lang-switch-m{display:none}@media(max-width:600px){.nav-right .lang-switch{display:none}.lang-switch.lang-switch-m{display:flex;gap:8px;margin:8px 0 0;font-size:15px}.lang-switch-m a{padding:8px 12px}}</style><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>html[lang=fa] body,html[lang=fa] button,html[lang=fa] input,html[lang=fa] textarea{font-family:Vazirmatn,'Geist',sans-serif}html[lang=fa] .h2,html[lang=fa] h1,html[lang=fa] h2{letter-spacing:0!important}html[lang=fa] .kicker{letter-spacing:0}</style><script>document.addEventListener("DOMContentLoaded",function(){var q=location.search+location.hash;if(q)document.querySelectorAll(".lang-switch a").forEach(function(a){a.setAttribute("href",a.getAttribute("href")+q);});});</script>
<!-- /i18n:head -->
</head>
<body>
<header class="nav" id="nav">
<div class="nav-in">
<a class="brand" href="/fa/"><img alt="" height="36" src="/logo-512.png" width="36"/><span>MysMatch</span></a>
<div class="nav-right"><!-- i18n:switch --><div class="lang-switch" aria-label="Language"><a href="/challenge/reset" hreflang="en" lang="en">EN</a><a href="/de/challenge/reset" hreflang="de" lang="de">DE</a><a href="/fa/challenge/reset" hreflang="fa" lang="fa" aria-current="true">فا</a></div><!-- /i18n:switch --><a class="nav-cta" href="/fa/challenge/">چالش تولید محتوا</a></div>
</div>
<div class="progress" id="progress"></div>
</header>
<section class="page-hero short">
<div class="hero-stack"><div class="hero-head"><div class="kicker">/ حساب</div><h1>رمز عبور جدید بگذار.</h1></div></div>
</section>
<section class="sheet sheet-white">
<div class="in">
<div class="r-wrap">
<div class="c-msg" hidden="" id="msg"></div>
<form class="r-wrap" hidden="" id="form" novalidate="">
<label class="fld"><span class="lbl">رمز عبور جدید</span><input autocomplete="new-password" class="inp" id="p1" placeholder="دست‌کم ۶ کاراکتر" type="password"/></label>
<label class="fld"><span class="lbl">تکرار رمز</span><input autocomplete="new-password" class="inp" id="p2" type="password"/></label>
<div><button class="btn btn-dark" id="go" type="submit">ذخیرهٔ رمز ←</button></div>
</form>
<div hidden="" id="done"><a class="btn btn-violet" href="/fa/challenge/#enter">بازگشت به چالش ←</a></div>
</div>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/site.js"></script>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  function msg(t, ok) { $('msg').hidden = !t; $('msg').textContent = t || ''; $('msg').className = 'c-msg ' + (ok ? 'ok' : 'err'); }
  var q = new URLSearchParams(location.search);
  var hash = q.get('token_hash'), type = q.get('type');
  if (!hash || type !== 'recovery') { msg('این لینک ناقص است. لطفاً از صفحهٔ چالش لینک تازه بخواه («رمز عبور را فراموش کرده‌ای؟»).'); return; }
  // Exchange the one-time token for a session (it can only be used once).
  var v = await MM.db.auth.verifyOtp({ token_hash: hash, type: 'recovery' });
  if (v.error) { msg('این لینک منقضی شده یا قبلاً استفاده شده است. لطفاً از صفحهٔ چالش لینک تازه بخواه.'); $('done').hidden = false; return; }
  history.replaceState(null, '', location.pathname); // don't keep the token in the address bar
  $('form').hidden = false;
  $('form').onsubmit = async function (e) {
    e.preventDefault();
    var a = $('p1').value, b = $('p2').value;
    if (a.length < 6) return msg('رمز عبور باید دست‌کم ۶ کاراکتر باشد.');
    if (a !== b) return msg('دو رمز عبور یکی نیستند.');
    $('go').disabled = true;
    var r = await MM.db.auth.updateUser({ password: a });
    $('go').disabled = false;
    if (r.error) {
      var m = r.error.message || '';
      return msg(/known to be weak|pwned|leaked/i.test(m) ? 'این رمز عبور در یک نشت اطلاعات دیده شده است. لطفاً رمز دیگری انتخاب کن.' : m);
    }
    $('form').hidden = true; $('done').hidden = false;
    msg('رمز عبورت عوض شد. وارد شده‌ای.', true);
  };
})();
</script>
</body>
</html>
