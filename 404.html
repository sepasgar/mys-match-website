<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MysMatch</title>
  <meta name="description" content="Open this event in the MysMatch app.">
  <meta name="theme-color" content="#0F1020">

  <meta property="og:title" content="MysMatch">
  <meta property="og:description" content="Find study partners and classmates and join student events.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://www.mysmatch.com/og-image.png">

  <link rel="icon" type="image/png" href="/logo-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Oct 2026 redesign: same dark look as the rest of the site. Markup + logic unchanged. */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --ink:#0F1020; --on-dark:#C9C9D9; --faint:#A9AAC0; --violet:#7B5CFF; --mono:'Geist Mono',ui-monospace,monospace; }
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
      background: linear-gradient(160deg,#12132C 0%,#0F1020 55%,#181026 100%);
      background-image: radial-gradient(60% 45% at 10% 0%, rgba(123,92,255,0.16), transparent 70%),
                        radial-gradient(50% 40% at 95% 100%, rgba(233,75,154,0.10), transparent 70%),
                        linear-gradient(160deg,#12132C 0%,#0F1020 55%,#181026 100%);
    }
    .card { max-width: 480px; width: 100%; text-align: center; }
    .logo-tile { width: 84px; height: 84px; border-radius: 26px; background: linear-gradient(135deg,#7B5CFF 0%,#B55BE8 55%,#E94B9A 100%); margin: 0 auto 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 60px rgba(123,92,255,0.35); }
    .logo-tile svg { width: 40px; height: 40px; }
    .eyebrow { font-family: var(--mono); color: var(--faint); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 16px; }
    h1 { font-size: clamp(40px, 9vw, 64px); font-weight: 700; letter-spacing: -0.055em; line-height: 0.95; margin-bottom: 18px; }
    .lede { color: var(--on-dark); font-size: 17px; line-height: 1.55; margin-bottom: 32px; }
    .open-app-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 18px 28px; background: var(--violet); color: #fff; text-decoration: none; font-weight: 600; font-size: 17px; border-radius: 9999px; box-shadow: 0 14px 40px rgba(123,92,255,0.3); margin-bottom: 12px; border: 0; cursor: pointer; transition: transform .3s, background .3s; }
    .open-app-btn:hover { background: #9B5BFF; transform: translateY(-2px); }
    .card > p[style] { color: var(--faint) !important; }
    .stores { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .store-badge { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; background: #fff; border-radius: 18px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; transition: transform .3s, background .3s; }
    .store-badge:hover { background: #F1ECFF; transform: translateY(-2px); }
    .store-badge svg { width: 20px; height: 20px; }
    .home-link { display: block; margin-top: 36px; color: var(--faint); font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; text-decoration: none; }
    .home-link:hover { color: #fff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-tile">
      <!-- Placeholder calendar/check icon — swap for app logo SVG later if desired. -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 2v3M16 2v3M3.5 9h17M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 14l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <p class="eyebrow" id="eyebrow">MYSMATCH</p>
    <h1 id="title">Open this event</h1>
    <p class="lede" id="lede">
      We're trying to open this event in the MysMatch app. If nothing happens,
      install the app and tap the link again.
    </p>

    <!-- Primary CTA — tries to open the event in-app via the custom scheme.
         On iOS / Android with the app installed, the universal/app link
         intercepts BEFORE this page loads, so users see the app directly.
         This button is the fallback for browsers / desktop / app-less users. -->
    <a class="open-app-btn" id="openAppBtn" href="#">Open in MysMatch</a>

    <p style="font-size: 13px; color: var(--gray-light); margin: 18px 0 10px;">
      Don't have the app yet?
    </p>

    <div class="stores">
      <a class="store-badge" href="https://apps.apple.com/app/mysmatch/id6762192785" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.05 12.04c-.03-3.06 2.5-4.53 2.61-4.6-1.42-2.08-3.63-2.37-4.42-2.4-1.88-.19-3.67 1.1-4.62 1.1-.96 0-2.43-1.08-4-1.05-2.06.03-3.96 1.2-5.02 3.05-2.14 3.72-.55 9.21 1.53 12.22 1.02 1.47 2.23 3.13 3.81 3.07 1.53-.06 2.11-.99 3.96-.99 1.85 0 2.37.99 3.99.96 1.65-.03 2.69-1.5 3.7-2.99 1.17-1.71 1.65-3.37 1.67-3.46-.04-.02-3.21-1.23-3.25-4.91zM14.2 3.36c.84-1.02 1.41-2.44 1.25-3.86-1.21.05-2.68.81-3.55 1.83-.77.91-1.46 2.36-1.28 3.75 1.36.1 2.74-.69 3.58-1.72z"/>
        </svg>
        App Store
      </a>
      <a class="store-badge" href="https://play.google.com/store/apps/details?id=com.mysmatch.app" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.6 1.5c-.3.2-.5.6-.5 1v19c0 .4.2.8.5 1l10.7-10.7L3.6 1.5zm12.7 8.4l3.7-2.1c.8-.5.8-1.6 0-2.1L16 3.6l-2.8 2.8 3.1 3.5zm-1.9 1.6L4 22h.5L15.4 15l-1-3.5zm0-1.6 1-3.5L4.5 0H4l10.4 9.9z"/>
        </svg>
        Google Play
      </a>
    </div>

    <a class="home-link" href="/">← Back to MysMatch home</a>
  </main>

  <script>
    // GitHub Pages serves this file as the response to any path that doesn't
    // exist on disk. We use it as a soft router: if the path looks like an
    // event share link, render the "Open in app" UI and wire the CTA to the
    // custom URL scheme. Otherwise (e.g. someone typoed a URL), fall through
    // to a generic not-found message. The HTTP status remains 404 either way
    // — this only affects what the user sees, not how search engines treat it.
    (function () {
      var path = window.location.pathname || '';
      var eventMatch = path.match(/^\/event\/([^/]+)\/?$/);

      if (eventMatch) {
        var eventId = eventMatch[1];
        // Custom scheme fallback for in-app navigation when universal links
        // verification hasn't propagated yet (first ~5 min after install).
        document.getElementById('openAppBtn').setAttribute('href', 'mysmatch://event/' + eventId);
      } else {
        // Generic 404 — keep the layout, swap the copy.
        document.getElementById('eyebrow').textContent = '404';
        document.getElementById('title').textContent = 'Page not found';
        document.getElementById('lede').textContent =
          "The page you're looking for doesn't exist. Try heading back to the home page.";
        document.getElementById('openAppBtn').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
