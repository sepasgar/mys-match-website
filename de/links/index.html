<!DOCTYPE html>

<!--
  MysMatch link-in-bio page (www.mysmatch.com/links) for the Instagram bio.
  WHY self-hosted instead of Linktree: the link stays on our own domain/brand, has
  no third-party footer, and is one static file we edit like the rest of the site.
  Styling copies the landing page tokens (Geist + violet→magenta gradient) so it
  feels like part of the same site. Store URLs and the contact mailbox are the same
  ones used on the landing page — keep them in sync if those ever change.
-->
<html dir="ltr" lang="de">
<head>
<meta charset="utf-8"/>
<title>MysMatch — Links</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="Lade MysMatch im App Store oder bei Google Play, besuch unsere Website oder schreib uns." name="description"/>
<meta content="#0F1020" name="theme-color"/>
<!-- WHY noindex: a thin page of outbound links adds nothing for search; the
     landing page should be what ranks. Not listed in sitemap.xml for the same reason. -->
<meta content="noindex, follow" name="robots"/>
<!-- Open Graph: Instagram's in-app browser and DMs show this preview card -->
<meta content="MysMatch — Links" property="og:title"/>
<meta content="Hol dir die App, besuch unsere Website oder sag hallo." property="og:description"/>
<meta content="website" property="og:type"/>
<meta content="https://www.mysmatch.com/de/links/" property="og:url"/>
<meta content="https://www.mysmatch.com/og-image-v3.jpg" property="og:image"/>
<meta content="summary_large_image" name="twitter:card"/>
<link href="/logo-512.png" rel="icon" type="image/png"/>
<link href="https://www.mysmatch.com/de/links/" rel="canonical"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet"/>
<style>
  /* Oct 2026 redesign: dark look of the new site (was white). Markup unchanged. */
  :root{
    --ink:#0F1020;
    --muted:rgba(201,201,217,0.8);
    --bg:#0F1020;
    --card:#17182C;
    --line:rgba(255,255,255,0.08);
    --grad:linear-gradient(100deg,#7B5CFF 0%,#B55BE8 55%,#E94B9A 100%);
    --shadow-sm:0 1px 2px rgba(0,0,0,0.2);
    --grad-shadow:0 14px 40px rgba(123,92,255,0.3);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; }
  body{
    font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#fff;
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    /* WHY: soft brand glow behind the column, echoing the landing hero */
    background-image:
      radial-gradient(60% 40% at 15% 0%, rgba(123,92,255,0.18), transparent 70%),
      radial-gradient(55% 40% at 90% 10%, rgba(233,75,154,0.12), transparent 70%);
    background-repeat:no-repeat;
  }
  main{
    max-width:440px;
    margin:0 auto;
    padding:56px 16px 40px;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; min-height:100dvh;
  }
  .logo{
    width:88px; height:88px; border-radius:24px; display:block;
    box-shadow:var(--grad-shadow);
  }
  h1{
    margin-top:18px;
    font-size:32px; font-weight:700; letter-spacing:-0.05em;
  }
  .tagline{
    margin-top:6px; text-align:center;
    font-family:'Instrument Serif',serif; font-style:italic;
    font-size:20px; color:var(--muted);
  }
  .links{
    width:100%; margin-top:32px;
    display:flex; flex-direction:column; gap:12px;
    list-style:none;
  }
  .link{
    display:flex; align-items:center; gap:14px;
    width:100%; min-height:60px; padding:12px 18px;
    border-radius:22px;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
    color:#fff; text-decoration:none;
    font-weight:600; font-size:16px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .link:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,0.2); }
  .link.primary:hover{ box-shadow:0 20px 50px rgba(123,92,255,0.4); }
  .link:active{ transform:translateY(0); }
  .link:focus-visible{ outline:3px solid #8A3BFF; outline-offset:3px; }
  .link .ic{
    flex:none; width:36px; height:36px; border-radius:11px;
    display:grid; place-items:center;
    background:rgba(255,255,255,0.08); color:#fff;
  }
  .link .txt{ display:flex; flex-direction:column; line-height:1.2; flex:1; min-width:0; }
  .link .txt small{ font-size:12px; font-weight:500; color:var(--muted); }
  .link .arrow{ flex:none; opacity:.35; }
  /* WHY: the two store buttons are the main goal of the page, so they get the
     brand gradient; website + email stay as quieter white cards. */
  .link.primary{
    background:var(--grad); color:#fff; border-color:transparent;
    /* WHY: without this the gradient tiles under the transparent border and
       leaves a thin magenta sliver on the left edge */
    background-origin:border-box;
    box-shadow:var(--grad-shadow);
  }
  .link.primary .ic{ background:rgba(255,255,255,0.18); }
  .link.primary .txt small{ color:rgba(255,255,255,0.8); }
  .link.primary .arrow{ opacity:.7; }
  footer{
    margin-top:auto; padding-top:40px;
    font-family:'Geist Mono',ui-monospace,monospace; font-size:12px; color:var(--muted);
  }
  footer a{ color:inherit; }
  @media (prefers-reduced-motion:reduce){ .link{ transition:none; } .link:hover{ transform:none; } }
  /* v6 theme (Oct 2026): same gradient + lines + grain as the rest of the site.
     The store buttons stay the main goal, so they become solid ink pills that
     stand out on the gradient; website + email are white cards. */
  body{ color:#0F1020; background:
      radial-gradient(50% 50% at 78% 30%, rgba(255,192,238,0.51) 0%, rgba(255,255,255,0) 70%),
      radial-gradient(50% 50% at 50% 70%, rgba(160,170,255,0.5) 0%, rgba(255,255,255,0) 70%),
      linear-gradient(176deg,#EEA6E8 0%,#D0A2F0 30%,#BBA7F4 55%,#A9ADF5 100%) fixed; }
  body::before{ content:""; position:fixed; inset:0; background:url(/media/lines.svg) center/cover no-repeat; mix-blend-mode:screen; opacity:0.55; pointer-events:none; }
  main{ position:relative; }
  .tagline, footer{ color:rgba(42,36,64,0.75); }
  .logo{ box-shadow:0 14px 40px rgba(40,20,120,0.3); }
  .link{ background:rgba(255,255,255,0.9); color:#0F1020; border-color:rgba(255,255,255,0.7); box-shadow:0 8px 24px rgba(60,30,140,0.16); }
  .link:hover{ border-color:#fff; }
  .link .ic{ background:rgba(46,40,192,0.08); color:#2E28C0; }
  .link .txt small{ color:#4B4C63; }
  .link.primary{ background:#0F1020; color:#fff; box-shadow:0 14px 40px rgba(40,20,120,0.3); }
  .link.primary:hover{ box-shadow:0 20px 50px rgba(40,20,120,0.4); }
  .link.primary .ic{ background:rgba(255,255,255,0.14); color:#fff; }
  .link.primary .txt small{ color:rgba(255,255,255,0.72); }
  /* Ideation Challenge = gold card (owner, 2026-10-18); after the v6 .link rule so it wins. */
  .link.gold{ background:linear-gradient(135deg,#FBE3A1 0%,#F2C75C 50%,#D9A63A 100%); color:#2A1F05; border-color:rgba(255,255,255,0.6); box-shadow:0 8px 24px rgba(217,166,58,0.35); }
  .link.gold small{ color:rgba(42,31,5,0.7); }
  .link.gold .ic{ background:rgba(42,31,5,0.12); color:#2A1F05; }
</style>
<!-- Plausible analytics (Oct 2026): cookieless page views + custom events (js/analytics.js). -->
