<!-- WHY (Oct 2026): email + Google links always return to the English page
     (Supabase Redirect URLs / auth-callback only know /challenge/). ?lang= or
     the language remembered by js/challenge.js sends people on to the
     /de/ or /fa/ copy; search + #hash are kept (the login token is in it). -->
<script>
(function () {
  if (document.documentElement.lang !== 'en') return;
  var m = /[?&]lang=(de|fa)(&|$)/.exec(location.search), l = m ? m[1] : null;
  if (!l && /[?&](welcome=1|token_hash=)/.test(location.search)) { try { l = localStorage.getItem('mmc-lang'); } catch (e) {} }
  if (l === 'de' || l === 'fa') location.replace('/' + l + location.pathname + location.search + location.hash);
})();
</script>

     reset email goes through the auth-callback edge function, which sends

  .c-msg{ font-size:16px; line-height:1.5; padding:14px 18px; border-radius:16px; }
  .c-msg.err{ background:#FDECF2; color:#B4214F; } .c-msg.ok{ background:#E8F8EF; color:#1C7A4A; }
</style>

<style>.lang-dd{position:relative;margin-inline-end:8px;font-size:14px;font-weight:600}.lang-dd>summary{list-style:none;display:flex;align-items:center;gap:6px;cursor:pointer;padding:9px 12px;border-radius:999px;color:var(--nav-ink,#1E1A36);background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.5);letter-spacing:.04em;user-select:none;white-space:nowrap}.lang-dd>summary::-webkit-details-marker{display:none}.lang-dd>summary:hover,.lang-dd[open]>summary{background:rgba(255,255,255,.6)}.lang-dd>summary svg{flex:none}.lang-dd[open]>summary .lang-dd-caret{transform:rotate(180deg)}.lang-dd-list{position:fixed;z-index:2147483000;min-width:180px;max-height:70vh;overflow:auto;padding:6px;border-radius:16px;background:#fff;box-shadow:0 16px 48px rgba(30,26,54,.22),0 2px 6px rgba(30,26,54,.08);display:flex;flex-direction:column}.lang-dd-list[hidden]{display:none}.lang-dd-list.lang-dd-list a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 14px;border-radius:10px;color:#1E1A36;font-size:15px;font-weight:500;letter-spacing:0;text-decoration:none;text-shadow:none;background:none;font-family:inherit}.lang-dd-list.lang-dd-list a:hover{background:#F3EFFF}.lang-dd-list.lang-dd-list a[aria-current]{font-weight:700;background:#F3EFFF}.lang-dd-list.lang-dd-list a[aria-current]::after{content:"✓";color:#5B3FE0}.lang-dd-code{font-size:13px}.lang-dd-m{display:none}@media(max-width:640px){.nav-right .lang-dd{display:none}.lang-dd.lang-dd-m{display:block;margin:10px 0 0}}</style><script>document.addEventListener("DOMContentLoaded",function(){var q=location.search+location.hash;if(q)document.querySelectorAll(".lang-switch a").forEach(function(a){a.setAttribute("href",a.getAttribute("href")+q);});document.querySelectorAll("details.lang-dd").forEach(function(d){var s=d.querySelector("summary"),l=d.querySelector(".lang-dd-list");document.body.appendChild(l);l.hidden=true;function place(){var r=s.getBoundingClientRect();l.style.top=(r.bottom+8)+"px";if(r.left+r.width/2<innerWidth/2){l.style.left=Math.max(8,r.left)+"px";l.style.right="auto";}else{l.style.right=Math.max(8,innerWidth-r.right)+"px";l.style.left="auto";}}d.addEventListener("toggle",function(){l.hidden=!d.open;if(d.open)place();});document.addEventListener("click",function(e){if(d.open&&!d.contains(e.target)&&!l.contains(e.target))d.open=false;});document.addEventListener("keydown",function(e){if(e.key==="Escape"&&d.open){d.open=false;s.focus();}});addEventListener("scroll",function(){if(d.open)d.open=false;},{passive:true});addEventListener("resize",function(){if(d.open)place();});});});</script>

</section>
<section class="sheet sheet-white">
<div class="in">
<div class="r-wrap">
<div class="c-msg" hidden="" id="msg"></div>
<form class="r-wrap" hidden="" id="form" novalidate="">
<label class="fld"><span class="lbl">Neues Passwort</span><input autocomplete="new-password" class="inp" id="p1" placeholder="Mindestens 6 Zeichen" type="password"/></label>
<label class="fld"><span class="lbl">Wiederholen</span><input autocomplete="new-password" class="inp" id="p2" type="password"/></label>
<div><button class="btn btn-dark" id="go" type="submit">Passwort speichern →</button></div>
</form>
<div hidden="" id="done"><a class="btn btn-violet" href="/de/challenge/#enter">Zurück zur Challenge →</a></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/site.js"></script>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  function msg(t, ok) { $('msg').hidden = !t; $('msg').textContent = t || ''; $('msg').className = 'c-msg ' + (ok ? 'ok' : 'err'); }
  var q = new URLSearchParams(location.search);
  var hash = q.get('token_hash'), type = q.get('type');
  if (!hash || type !== 'recovery') { msg('Dieser Link ist unvollständig. Bitte fordere auf der Challenge-Seite einen neuen an („Passwort vergessen?“).'); return; }
  // Exchange the one-time token for a session (it can only be used once).
  var v = await MM.db.auth.verifyOtp({ token_hash: hash, type: 'recovery' });
  if (v.error) { msg('Dieser Link ist abgelaufen oder wurde schon benutzt. Bitte fordere auf der Challenge-Seite einen neuen an.'); $('done').hidden = false; return; }
  history.replaceState(null, '', location.pathname); // don't keep the token in the address bar
  $('form').hidden = false;
  $('form').onsubmit = async function (e) {
    e.preventDefault();
    var a = $('p1').value, b = $('p2').value;
    if (a.length < 6) return msg('Das Passwort muss mindestens 6 Zeichen haben.');
    if (a !== b) return msg('Die beiden Passwörter stimmen nicht überein.');
    $('go').disabled = true;
    var r = await MM.db.auth.updateUser({ password: a });
    $('go').disabled = false;
    if (r.error) {
      var m = r.error.message || '';
      return msg(/known to be weak|pwned|leaked/i.test(m) ? 'Dieses Passwort ist in einem Datenleck aufgetaucht. Bitte wähle ein anderes.' : m);
    }
    $('form').hidden = true; $('done').hidden = false;
    msg('Dein Passwort wurde geändert. Du bist angemeldet.', true);
  };
})();
</script>
